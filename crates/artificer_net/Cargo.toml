[package]
name = "artificer_net"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Tokio-based WebSocket listener for authoritative servers.
server = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util"]
# Blocking/nonblocking WebSocket client for native game clients and bots.
client-native = ["dep:tungstenite"]

[dependencies]
artificer_core = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }
log = { workspace = true }

tokio = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
tungstenite = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "WebSocket",
    "BinaryType",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
] }
