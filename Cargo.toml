[workspace]
resolver = "2"
members = [
    "crates/aether_core",
    "crates/aether_scene",
    "crates/aether_physics",
    "crates/aether_input",
    "crates/aether_assets",
    "crates/aether_render",
    "crates/aether_net",
    "crates/aether_testkit",
    "samples/minimal",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
aether_core = { path = "crates/aether_core" }
aether_scene = { path = "crates/aether_scene" }
aether_physics = { path = "crates/aether_physics" }
aether_input = { path = "crates/aether_input" }
aether_assets = { path = "crates/aether_assets" }
aether_render = { path = "crates/aether_render" }
aether_net = { path = "crates/aether_net" }
aether_testkit = { path = "crates/aether_testkit" }

glam = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rapier3d = "0.34"
log = "0.4"
postcard = { version = "1", features = ["use-std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-tungstenite = "0.30"
tungstenite = "0.30"
futures-util = "0.3"

[workspace.dependencies.bevy]
version = "0.16"
default-features = false
features = [
    "std",
    "bevy_log",
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_render",
    "bevy_scene",
    "bevy_state",
    "bevy_window",
    "bevy_winit",
    "bevy_ui",
    "bevy_text",
    "default_font",
    "bevy_gizmos",
    "multi_threaded",
    "tonemapping_luts",
    "png",
]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
