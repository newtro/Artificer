[workspace]
resolver = "2"
members = [
    "crates/artificer_core",
    "crates/artificer_scene",
    "crates/artificer_physics",
    "crates/artificer_input",
    "crates/artificer_assets",
    "crates/artificer_render",
    "crates/artificer_net",
    "crates/artificer_agent",
    "crates/artificer_testkit",
    "samples/minimal",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
artificer_core = { path = "crates/artificer_core" }
artificer_scene = { path = "crates/artificer_scene" }
artificer_physics = { path = "crates/artificer_physics" }
artificer_input = { path = "crates/artificer_input" }
artificer_assets = { path = "crates/artificer_assets" }
artificer_render = { path = "crates/artificer_render" }
artificer_net = { path = "crates/artificer_net" }
artificer_agent = { path = "crates/artificer_agent" }
artificer_testkit = { path = "crates/artificer_testkit" }

glam = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rapier3d = "0.34"
log = "0.4"
postcard = { version = "1", features = ["use-std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-tungstenite = "0.30"
tungstenite = "0.30"
futures-util = "0.3"

[workspace.dependencies.bevy]
version = "0.16"
default-features = false
features = [
    "std",
    "bevy_log",
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_render",
    "bevy_scene",
    "bevy_state",
    "bevy_window",
    "bevy_winit",
    "bevy_ui",
    "bevy_text",
    "default_font",
    "bevy_gizmos",
    "multi_threaded",
    "tonemapping_luts",
    "png",
]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
